<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- Website sudah dua bahasa; terjemahan otomatis browser mengubah teks diam-diam dan membuat React crash (removeChild) -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dana Wardhiana</title>
    <meta name="description" content="Dana Wardhiana — projects, experience and contact." />
    <meta name="theme-color" content="#faf6f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14100e" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dana Wardhiana" />
    <meta property="og:description" content="Projects, experience, skills and certificates of Dana Wardhiana." />
    <meta property="og:url" content="https://danazzz.github.io/portfolio/" />
    <meta property="og:image" content="https://danazzz.github.io/portfolio/assets/profile/avatar.png" />
    <meta name="twitter:card" content="summary" />

    <script>
      // Pasang tema sebelum halaman tampil supaya tidak berkedip.
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

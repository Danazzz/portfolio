# Supabase paket gratis akan "tidur" jika tidak dipakai 7 hari.
# Workflow ini menyapa database setiap 3 hari supaya tetap aktif.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Secrets Supabase belum diisi, lewati."
            exit 0
          fi
          curl --fail --silent --show-error \
            "$URL/rest/v1/profile?select=id&limit=1" \
            -H "apikey: $KEY" > /dev/null
          echo "Database aktif."
